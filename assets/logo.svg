<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f2b"/>
      <stop offset="100%" stop-color="#10131a"/>
    </linearGradient>
  </defs>

  <!-- 圆角徽章背景 -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" stroke="#2a3040" stroke-width="6"/>

  <!-- 内存芯片主体 -->
  <rect x="146" y="146" width="220" height="220" rx="28" fill="#242a38" stroke="#37d3a3" stroke-width="8"/>

  <!-- 芯片引脚（顶部与底部） -->
  <g stroke="#37d3a3" stroke-width="12" stroke-linecap="round">
    <line x1="176" y1="128" x2="176" y2="146"/>
    <line x1="226" y1="128" x2="226" y2="146"/>
    <line x1="276" y1="128" x2="276" y2="146"/>
    <line x1="326" y1="128" x2="326" y2="146"/>
    <line x1="176" y1="366" x2="176" y2="384"/>
    <line x1="226" y1="366" x2="226" y2="384"/>
    <line x1="276" y1="366" x2="276" y2="384"/>
    <line x1="326" y1="366" x2="326" y2="384"/>
  </g>

  <!-- 内存条（三条竖条，不同透明度表示使用率） -->
  <g fill="#37d3a3">
    <rect x="182" y="182" width="36" height="148" rx="8"/>
    <rect x="238" y="182" width="36" height="148" rx="8" opacity="0.55"/>
    <rect x="294" y="182" width="36" height="148" rx="8" opacity="0.28"/>
  </g>
</svg>
